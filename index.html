<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D Interactive Building Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><h1 id="ptitle">3D Interactive Building Model</h1><p id="psub"></p></div>
    <div class="seg" role="group" aria-label="View mode" id="modes">
      <button type="button" data-mode="mass" aria-pressed="true">3D Massing</button>
      <button type="button" data-mode="axon" aria-pressed="false">Axon</button>
      <button type="button" data-mode="stack" aria-pressed="false">Section Stack</button>
    </div>
    <div class="tools" id="tools">
      <a class="btn" href="templates/program_template.xlsx" download title="Excel template with the demo campus as example rows">Download template</a>
      <button type="button" class="btn" data-act="import" title="Load a program from Excel (.xlsx) or CSV">Import program…</button>
      <input type="file" id="importFile" accept=".xlsx,.xls,.csv" hidden>
      <button type="button" class="btn" data-act="labels" aria-pressed="true">Labels</button>
      <button type="button" class="btn" data-act="resetview">Reset view</button>
      <button type="button" class="btn" data-act="resetlayout">Reset layout</button>
      <button type="button" class="btn" data-act="present" aria-pressed="false">Present</button>
    </div>
  </header>
  <aside class="side left" id="left"></aside>
  <main class="stage" id="stage">
    <canvas id="gl" aria-label="Interactive massing model"></canvas>
    <div id="overlay"></div>
    <div class="status" id="status" hidden></div>
    <div class="hint" id="hint"></div>
  </main>
  <aside class="side right" id="right"></aside>
</div>
<dialog class="dlg" id="importDlg" aria-labelledby="importTitle">
  <form method="dialog">
    <div class="dlg-body" id="importBody"></div>
    <div class="dlg-actions">
      <button type="submit" class="btn" value="cancel">Cancel</button>
      <button type="submit" class="btn primary" value="ok" id="importOk">Replace project</button>
    </div>
  </form>
</dialog>
<script type="module" src="/src/main.js"></script>
</body>
</html>
